apiVersion: v1
kind: Secret
metadata:
  name: vitalsync-db-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "votre_mot_de_passe_secure"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitalsync-backend
  labels:
    app: vitalsync-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vitalsync-backend
  template:
    metadata:
      labels:
        app: vitalsync-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/jilen15/vitalsync/backend:main
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          value: "postgresql://vitalsync_user:${POSTGRES_PASSWORD}@vitalsync-db:5432/vitalsync_db"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vitalsync-db-secret
              key: POSTGRES_PASSWORD
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: vitalsync-backend-svc
spec:
  selector:
    app: vitalsync-backend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: vitalsync-frontend-svc
spec:
  selector:
    app: vitalsync-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vitalsync-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - host: vitalsync.local
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: vitalsync-frontend-svc
            port:
              number: 80
